{{- if .Values.executor.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-config
  labels:
    app.kubernetes.io/name: executor-k8s-openhands
    app.kubernetes.io/instance: {{ .Values.name }}
type: Opaque
stringData:
  config.yaml: |
    broker:
      url: {{ .Values.broker.url | quote }}
      token: {{ required "broker.token is required (the Executor's JWT from executor-registry)" .Values.broker.token | quote }}
      ca_file: /run/flowai/stand-ca/{{ .Values.broker.caKey }}
      request_timeout: {{ .Values.broker.requestTimeout | quote }}
    env_registry_url: {{ .Values.envRegistryURL | quote }}
    model_registry_url: {{ .Values.modelRegistryURL | quote }}
    max_parallel_tasks: {{ .Values.executor.maxParallelTasks | int }}
    heartbeat_interval: {{ .Values.executor.heartbeatInterval | quote }}
    heartbeat_miss_limit: {{ .Values.executor.heartbeatMissLimit | int }}
    connection_wait: {{ .Values.executor.connectionWait | quote }}
    pending_recheck_interval: {{ .Values.executor.pendingRecheckInterval | quote }}
    drain_timeout_seconds: {{ .Values.executor.drainTimeoutSeconds | int }}
    finished_cleanup_delay: {{ .Values.executor.finishedCleanupDelay | quote }}
    failed_cleanup_delay: {{ .Values.executor.failedCleanupDelay | quote }}
    executor_api_bind: ":8080"
    log_level: {{ .Values.executor.logLevel | quote }}
    namespace: {{ .Release.Namespace | quote }}
    service_account: {{ .Values.name | quote }}
    image_pull_policy: IfNotPresent
    litellm_data_pod_labels:
      {{- toYaml .Values.executor.litellmDataPodLabels | nindent 6 }}
    cache_dir: {{ printf "%s/cache" .Values.executor.dataDir | quote }}
    openhands_port: {{ .Values.openhands.port | int }}
    openhands_workspace: {{ .Values.openhands.workspace | quote }}
    openhands_llm_usage_id: {{ .Values.openhands.llmUsageID | quote }}
    openhands_initial_run: true
{{- end }}

name: Qualify Kubernetes OpenHands Executor
run-name: Qualify Kubernetes OpenHands Executor at ${{ inputs.expected_source_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the selected Executor ref
        type: string
        required: true
      env_registry_sha:
        description: Full commit SHA of flowai-env-registry
        type: string
        required: true
      executor_registry_sha:
        description: Full commit SHA of flowai-executor-registry
        type: string
        required: true
      model_registry_sha:
        description: Full commit SHA of flowai-model-registry
        type: string
        required: true
      task_manager_sha:
        description: Full commit SHA of flowai-task-manager
        type: string
        required: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      ENV_REGISTRY_SHA: ${{ inputs.env_registry_sha }}
      EXECUTOR_REGISTRY_SHA: ${{ inputs.executor_registry_sha }}
      MODEL_REGISTRY_SHA: ${{ inputs.model_registry_sha }}
      TASK_MANAGER_SHA: ${{ inputs.task_manager_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA ENV_REGISTRY_SHA EXECUTOR_REGISTRY_SHA MODEL_REGISTRY_SHA TASK_MANAGER_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$input must be a 40-digit lowercase hexadecimal commit SHA." >&2
              exit 1
            fi
            printf '%s=%s\n' "$input" "${!input}"
          done
          if [[ "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout and stage pinned publisher schemas
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod || ! -s qualification/publisher-schemas.txt ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi
          contracts="$(mktemp -d "$RUNNER_TEMP/executor-k8s-contracts.XXXXXXXX")"
          while read -r path pin digest; do
            if [[ ! "$path" =~ ^svc/([a-z-]+)/schemas/[a-zA-Z0-9._-]+\.schema\.json$ ]]; then
              echo "Invalid schema path: $path" >&2
              exit 1
            fi
            publisher="${BASH_REMATCH[1]}"
            case "$publisher" in
              env-registry) sha="$ENV_REGISTRY_SHA" ;;
              executor-registry) sha="$EXECUTOR_REGISTRY_SHA" ;;
              model-registry) sha="$MODEL_REGISTRY_SHA" ;;
              task-manager) sha="$TASK_MANAGER_SHA" ;;
              *) exit 1 ;;
            esac
            if [[ "$sha" != "$pin" || ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Dispatch pin or manifest digest mismatch for $path." >&2
              exit 1
            fi
            url="https://raw.githubusercontent.com/pandops/flowai-$publisher/$sha/${path#svc/"$publisher"/}"
            mkdir -p "$contracts/${path%/*}"
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$path" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
            printf '%s  %s\n' "$digest" "$contracts/$path" | sha256sum --check --status
            python3 -c 'import json, sys; sys.exit(not isinstance(json.load(open(sys.argv[1])), dict))' "$contracts/$path"
            printf '%s ' "$url"
            (cd "$contracts" && sha256sum "$path")
          done < qualification/publisher-schemas.txt
          printf 'FLOWAI_CONTRACT_FIXTURE_DIR=%s\n' "$contracts" >> "$GITHUB_ENV"

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Verify Go modules and run baseline-owned tests
        shell: bash
        run: |
          go mod verify
          go test -mod=readonly -count=1 -coverpkg=./... -v ./...
          go test -mod=readonly -count=1 -tags=integration -v ./...

      - name: Qualify Kubernetes packaging inputs offline
        shell: bash
        working-directory: qualification
        run: |
          set -euo pipefail

          helm version --short
          helm lint --strict baseline-chart --values render-values.yaml
          helm lint --strict baseline-chart --values baseline-values-k3d.yaml --values render-values.yaml

          # The missing-token guard must still reject an unconfigured release.
          if failure="$(helm template executor-k8s-openhands baseline-chart --namespace flowai-qualification 2>&1)" ||
             [[ "$failure" != *'broker.token is required'* ]]; then
            echo 'The chart did not reject a missing broker.token as expected.' >&2
            exit 1
          fi

          helm template executor-k8s-openhands baseline-chart --namespace flowai-qualification --values render-values.yaml
          helm template executor-k8s-openhands baseline-chart --namespace flowai-qualification \
            --values baseline-values-k3d.yaml --values render-values.yaml

      - name: Build untagged Linux image
        shell: bash
        run: |
          docker build --platform linux/amd64 -f Containerfile --iidfile "$RUNNER_TEMP/executor-k8s.iid" .
          image="$(cat "$RUNNER_TEMP/executor-k8s.iid")"
          docker image inspect --format '{{ .Id }} {{ .Config.User }} {{ json .Config.Entrypoint }} {{ json .Config.Cmd }}' "$image"
          help_status=0
          docker run --rm --network none "$image" --help > "$RUNNER_TEMP/executor-k8s-help.txt" 2>&1 || help_status=$?
          cat "$RUNNER_TEMP/executor-k8s-help.txt"
          [[ "$help_status" == 2 ]]
          grep -Fq 'Usage of executor_k8s_openhands:' "$RUNNER_TEMP/executor-k8s-help.txt"

      - name: Verify and package the qualified OCI image
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(cat "$RUNNER_TEMP/executor-k8s.iid")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(docker image inspect --format '{{ .Id }}' "$image_id")" == "$image_id" ]]
          layout="$RUNNER_TEMP/qualified-oci-layout"
          skopeo copy --format oci "docker-daemon:$image_id" "oci:$layout:qualified"
          manifest="$(jq -er '
            select(.schemaVersion == 2 and (.manifests | length) == 1)
            | .manifests[0]
            | select(.mediaType == "application/vnd.oci.image.manifest.v1+json")
            | .digest | select(test("^sha256:[a-f0-9]{64}$"))
          ' "$layout/index.json")"
          cd "$layout"
          manifest_path="blobs/sha256/${manifest#sha256:}"
          printf '%s  %s\n' "${manifest#sha256:}" "$manifest_path" | sha256sum --check
          config="$(jq -er '.config.digest | select(test("^sha256:[a-f0-9]{64}$"))' "$manifest_path")"
          skopeo inspect --config "docker-daemon:$image_id" | jq -cS . > "$RUNNER_TEMP/source-oci-config.json"
          jq -cS . "blobs/sha256/${config#sha256:}" | cmp "$RUNNER_TEMP/source-oci-config.json" -
          jq -er '
            [.config, .layers[]][].digest
            | if test("^sha256:[a-f0-9]{64}$") then sub("^sha256:"; "") else error("invalid OCI digest") end
            | "\(.)  blobs/sha256/\(.)"
          ' "$manifest_path" | sha256sum --check
          jq -e '.os == "linux" and .architecture == "amd64"' "blobs/sha256/${config#sha256:}" >/dev/null

          artifact="$RUNNER_TEMP/qualified-oci"
          mkdir "$artifact"
          tar -cf "$artifact/image.oci.tar" oci-layout index.json blobs
          cd "$artifact"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" \
            --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg imageId "$image_id" --arg manifest "$manifest" --arg config "$config" \
            '{repository:$repository,ref:$ref,source:$source,run:$run,attempt:$attempt,imageId:$imageId,manifest:$manifest,config:$config}' > receipt.json
          sha256sum image.oci.tar receipt.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload qualified OCI archive
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-oci-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-oci/image.oci.tar
            ${{ runner.temp }}/qualified-oci/receipt.json
            ${{ runner.temp }}/qualified-oci/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
